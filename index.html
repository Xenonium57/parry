<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      position: relative;
      text-align: center;
    }
    input {
      position: absolute;
      border: 2px solid black;
      text-align: center;
    }
    canvas {
      position: absolute;
      left: 0;
      top: 0;
      border: 1px solid black;
      touch-action: none;
    }
    canvas:focus {
      outline: none;
    }
    .pixel {
      image-rendering: pixelated;
    }
    #canvasWrapper {
      position: relative;
      display: inline-block;
      overflow: hidden;
      margin: 0 auto;
      width: 1002px;
      height: 527px;
    }
    #explain {
      position: relative;
      margin: 200px auto;
      width: 940px;
      padding: 30px;
      border: 1px solid black;
      border-radius: 30px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="canvasWrapper">
    <canvas id="canvas" width="1000" height="525" tabindex="-1"></canvas>
  </div>
  <div id="explain">問題範囲の変更(更新で適用)
  </div>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script src="main.js"></script>
</body>
</html>
